kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-deployer
rules:
- apiGroups: [""]
  resources: [
      "pods/log",
      "deployments",
      "configmaps",
      "services",
      "ingresses",
      "persistentvolumes",
      "persistentvolumeclaims",
      "namespaces",
      "secrets",
      "replicasets",
      "jobs",
      "cronjobs"
  ]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
