name: $(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  - group: TEST - Constants

pool:
  vmImage: ubuntu-22.04

steps:
  - checkout: self

  - script: |
      pwd
      echo "Repository contents:"
      ls -la
      
      echo "Application folder:"
      ls -la hi-status
    displayName: Verify structure

  - task: AzureStaticWebApp@0
    inputs:
      app_location: 'hi-status'
      output_location: ''
      skip_app_build: true
      azure_static_web_apps_api_token: $(hi_swa_token)
