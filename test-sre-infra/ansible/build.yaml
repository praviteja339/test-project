- name: SSL Certs Infrastructure
  hosts: localhost
  connection: local

  tasks:

  - set_fact:
      service_principal_id: "{{ lookup('env', 'service_principal_id') }}"
      service_principal_secret: "{{ lookup('env', 'service_principal_secret') }}"
      subscription_id: "{{ lookup('env', 'subscription_id') }}"
      tenant_id: "{{ lookup('env', 'tenant_id') }}"
      source_dir: "{{ lookup('env', 'source_dir') }}"
      env_dir: "{{ lookup('env', 'env_dir') }}"

  - name: Login to Azure using Service Principal {{ service_principal_id }}
    command: >
      az login
      --service-principal
      --username '{{ service_principal_id }}'
      --password '{{ service_principal_secret }}'
      --tenant '{{ tenant_id }}'

  - name: Set subscription {{ subscription_id }} to be current and active
    command: az account set --subscription {{ subscription_id }}

  - name: Decrypt SRE config file
    shell: sops --decrypt {{ source_dir }}/sre_infra_config.enc.yaml > {{ source_dir }}/sre_infra_config.yaml
    no_log: true

  - name: Include SRE Config file
    include_vars:
      file: "{{ source_dir }}/sre_infra_config.yaml"
    no_log: true

  - name: Download {{ cr_test_uat_cert_name }} Cert data from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ cr_test_uat_cert_name }} -f {{ source_dir }}/terraform/{{ cr_test_uat_cert_name }}.data

  - name: Generate {{ cr_test_uat_cert_name }}.pfx
    shell: cat {{ source_dir }}/terraform/{{ cr_test_uat_cert_name }}.data | base64 -d > {{ source_dir }}/terraform/{{ cr_test_uat_cert_name }}.pfx
    no_log: true

  - name: Download {{ query_central_uat_cert_name }} Cert data from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ query_central_uat_cert_name }} -f {{ source_dir }}/terraform/{{ query_central_uat_cert_name }}.data

  - name: Generate {{ query_central_uat_cert_name }}.pfx
    shell: cat {{ source_dir }}/terraform/{{ query_central_uat_cert_name }}.data | base64 -d > {{ source_dir }}/terraform/{{ query_central_uat_cert_name }}.pfx
    no_log: true

  - name: Download {{ portal_uat_cert_name }}Cert data from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ portal_uat_cert_name }} -f {{ source_dir }}/terraform/{{ portal_uat_cert_name }}.data

  - name: Generate {{ portal_uat_cert_name }}.pfx
    shell: cat {{ source_dir }}/terraform/{{ portal_uat_cert_name }}.data | base64 -d > {{ source_dir }}/terraform/{{ portal_uat_cert_name }}.pfx
    no_log: true

  - name: Download {{ hi_uat_cert_name }} Secret from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ hi_uat_cert_name }} -f ../terraform/{{ hi_uat_cert_name }}.data

  - name: Decode {{ hi_uat_cert_name }}.data
    shell: cat ../terraform/{{ hi_uat_cert_name }}.data | base64 -d > ../terraform/{{ hi_uat_cert_name }}.pfx
    no_log: true

  - name: Download {{ hi_cm_cert_name }} Secret from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ hi_cm_cert_name }} -f ../terraform/{{ hi_cm_cert_name }}.data

  - name: Decode {{ hi_cm_cert_name }}.data
    shell: cat ../terraform/{{ hi_cm_cert_name }}.data | base64 -d > ../terraform/{{ hi_cm_cert_name }}.pfx
    no_log: true

  - name: Download {{ hi_pricing_cert_name }} Cert data from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ hi_pricing_cert_name }} -f {{ source_dir }}/terraform/{{ hi_pricing_cert_name }}.data

  - name: Generate {{ hi_pricing_cert_name }}.pfx
    shell: cat {{ source_dir }}/terraform/{{ hi_pricing_cert_name }}.data | base64 -d > {{ source_dir }}/terraform/{{ hi_pricing_cert_name }}.pfx
    no_log: true

  - name: Download {{ test_cert_name }} Cert data from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ test_cert_name }} -f {{ source_dir }}/terraform/{{ test_cert_name }}.data

  - name: Generate {{ test_cert_name }}.pfx
    shell: cat {{ source_dir }}/terraform/{{ test_cert_name }}.data | base64 -d > {{ source_dir }}/terraform/{{ test_cert_name }}.pfx
    no_log: true

  ###########
  ## CA CERTS
  ###########
  
  # cr_te
  - name: Download {{ cr_test_ca_cert_name }} Cert data from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ cr_test_ca_cert_name }} -f {{ source_dir }}/terraform/{{ cr_test_ca_cert_name }}.data

  - name: Generate {{ cr_test_ca_cert_name }}.pfx
    shell: cat {{ source_dir }}/terraform/{{ cr_test_ca_cert_name }}.data | base64 -d > {{ source_dir }}/terraform/{{ cr_test_ca_cert_name }}.pfx
    no_log: true

  # query_central
  - name: Download {{ query_central_ca_cert_name }} Cert data from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ query_central_ca_cert_name }} -f {{ source_dir }}/terraform/{{ query_central_ca_cert_name }}.data

  - name: Generate {{ query_central_uat_cert_name }}.pfx
    shell: cat {{ source_dir }}/terraform/{{ query_central_ca_cert_name }}.data | base64 -d > {{ source_dir }}/terraform/{{ query_central_ca_cert_name }}.pfx
    no_log: true

  # hi
  - name: Download {{ hi_ca_cert_name }} Secret from AKV
    command: az keyvault secret download --vault-name {{ tls_key_vault_name }} -n {{ hi_ca_cert_name }} -f ../terraform/{{ hi_ca_cert_name }}.data

  - name: Decode {{ hi_ca_cert_name }}.data
    shell: cat ../terraform/{{ hi_ca_cert_name }}.data | base64 -d > ../terraform/{{ hi_ca_cert_name }}.pfx
    no_log: true


###################
# TERRAFORM
###################

  - name: Inject Terraform vars
    template:
      src: "{{ source_dir }}/terraform/terraform.tfvars.j2"
      dest: "{{ source_dir }}/terraform/terraform.tfvars"

  - name: Lookup TF state store key
    command: az storage account keys list -n testterraform -g TEST-DevOps --subscription xxxx --query '[0].value' -o tsv
    register: tf_state_store_key
    no_log: true

  - name: Run Terraform Apply
    terraform:
      project_path: "{{ source_dir }}/terraform/"
      state: present
      force_init: true
      lock: true
      backend_config:
        access_key: "{{ tf_state_store_key.stdout }}"
        storage_account_name: "{{ tf_state_store_name }}"
        container_name: "{{ tf_state_store_container_name }}"
        key: "{{ tf_state_store_file_name }}"
    register: terraform
    no_log: false

- import_playbook: validate.yaml
